<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroCart</title>
  <style>
    :root { --accent: #1f4fbf; --accent-dark: #173c91; --accent-soft: #e9effb; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f6f6f6; color: #222; }
    h1 { margin: 0 0 1rem; color: var(--accent); }
    main { max-width: 800px; }
    section { background: #fff; border-radius: 8px; border-top: 4px solid var(--accent); padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h2 { margin: 0 0 .5rem; font-size: 1.1rem; color: var(--accent-dark); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h3 { margin: 1rem 0 .25rem; font-size: .9rem; text-transform: uppercase; color: #666; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: .3rem .4rem; text-align: left; border-bottom: 1px solid #eee; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    button { cursor: pointer; border: 1px solid #999; background: #fafafa; border-radius: 4px; padding: .15rem .5rem; }
    button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
    tfoot td { font-weight: bold; border-top: 2px solid #ccc; }
    .muted { color: #888; font-size: .85rem; }
    #error { color: #b00; min-height: 1.2em; }
    #confirmation { color: #070; }
    #buy { background: #2a7; border-color: #185; color: #fff; font-weight: bold; font-size: 1.2rem; padding: .6rem 2rem; }
    #buy:hover { background: #185; }
    #buy:disabled { background: #ccc; border-color: #bbb; cursor: default; }
    .category { border: 1px solid #e3e3e3; border-radius: 6px; padding: .5rem .75rem; margin-top: .75rem; }
    .category summary { cursor: pointer; }
    .category summary::marker { color: var(--accent); }
    .category h3 { display: inline; margin: 0; }
    .category table { margin-top: .4rem; }
    .product-toggle { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; }
    .product-toggle::before { content: '▸ '; color: var(--accent); }
    .product-toggle[aria-expanded="true"]::before { content: '▾ '; }
    .product-toggle:hover { background: none; color: var(--accent); text-decoration: underline; }
    .product-detail td { background: #fafafa; }
    .product-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1rem; margin: .25rem 0 .25rem 1rem; }
    .product-detail dt { color: #666; }
    .product-detail dd { margin: 0; }
    .product-detail .incl-vat { font-weight: bold; color: var(--accent-dark); }
    #choose { font-size: 1rem; padding: .4rem 1rem; margin-bottom: 1rem; }
    #product-dialog { width: min(700px, calc(100% - 2rem)); max-height: 85vh; padding: 0; border: 0; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.25); }
    #product-dialog::backdrop { background: rgba(0,0,0,.4); }
    #product-dialog section { box-shadow: none; }
    #product-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }
    #product-dialog .dialog-actions button { padding: .4rem 1rem; }
    #add-selected { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
    #add-selected:hover { background: var(--accent-dark); color: #fff; }
    #add-selected:disabled { background: #ccc; border-color: #bbb; cursor: default; }
  </style>
</head>
<body>
  <h1>EuroCart</h1>
  <p id="error"></p>
  <p id="confirmation"></p>
  <button id="choose" data-i18n="chooseProducts">Choose products</button>
  <dialog id="product-dialog" aria-labelledby="products-heading">
    <form method="dialog">
      <section>
        <h2 id="products-heading" data-i18n="products">Products</h2>
        <p class="muted" id="products-note"></p>
        <div id="products"></div>
        <div class="dialog-actions">
          <button value="cancel" data-i18n="cancel">Cancel</button>
          <button value="add" id="add-selected" data-i18n="addToCart" disabled>Add to cart</button>
        </div>
      </section>
    </form>
  </dialog>
  <main>
    <!-- The cart stays hidden until products have been picked in the dialog. -->
    <section id="cart" hidden>
      <h2 data-i18n="cart">Cart</h2>
      <table>
        <thead><tr><th data-i18n="product">Product</th><th class="num" data-i18n="priceInclVat">Price incl. VAT</th><th class="num" data-i18n="qty">Qty</th><th class="num" data-i18n="lineTotal">Line total</th><th class="num" data-i18n="vat">VAT</th><th></th></tr></thead>
        <tbody id="cart-lines"></tbody>
        <tfoot>
          <tr><td data-i18n="subtotal">Subtotal (excl. VAT)</td><td></td><td></td><td class="num" id="subtotal"></td><td></td><td></td></tr>
          <tr><td id="vat-label"></td><td></td><td></td><td class="num" id="vat"></td><td></td><td></td></tr>
          <tr><td data-i18n="total">Total (incl. VAT)</td><td></td><td></td><td class="num" id="total"></td><td></td><td></td></tr>
        </tfoot>
      </table>
      <p><button id="buy" data-i18n="buy">Buy</button></p>
    </section>
  </main>

  <script>
    const messages = {
      en: {
        products: 'Products', cart: 'Cart', product: 'Product', origin: 'Origin', exclVat: 'Excl. VAT',
        priceExclVat: 'Price excl. VAT', priceInclVat: 'Price incl. VAT', qty: 'Qty', lineTotal: 'Line total', vat: 'VAT',
        subtotal: 'Subtotal (excl. VAT)', total: 'Total (incl. VAT)', buy: 'Buy', addToCart: 'Add to cart', remove: 'Remove',
        chooseProducts: 'Choose products', cancel: 'Cancel',
        productCode: 'Product code', vatCountry: 'VAT ({country})', vatRate: 'VAT ({rate}%)',
        productsNote: 'Prices in {currency}, excluding shipping and VAT. Click a product to see its price including VAT.',
        orderPlaced: 'Order #{number} placed: {total} (incl. {vat} VAT).',
        categories: { LAPTOP: 'Laptops', BOOK: 'Books', FOOD: 'Food', MEDICINE: 'Medicine', EBOOK: 'E-books' },
      },
      nl: {
        products: 'Producten', cart: 'Winkelwagen', product: 'Product', origin: 'Herkomst', exclVat: 'Excl. btw',
        priceExclVat: 'Prijs excl. btw', priceInclVat: 'Prijs incl. btw', qty: 'Aantal', lineTotal: 'Regeltotaal', vat: 'Btw',
        subtotal: 'Subtotaal (excl. btw)', total: 'Totaal (incl. btw)', buy: 'Kopen', addToCart: 'In winkelwagen', remove: 'Verwijderen',
        chooseProducts: 'Producten kiezen', cancel: 'Annuleren',
        productCode: 'Productcode', vatCountry: 'Btw ({country})', vatRate: 'Btw ({rate}%)',
        productsNote: 'Prijzen in {currency}, exclusief verzendkosten en btw. Klik op een product om de prijs inclusief btw te zien.',
        orderPlaced: 'Bestelling #{number} geplaatst: {total} (incl. {vat} btw).',
        categories: { LAPTOP: 'Laptops', BOOK: 'Boeken', FOOD: 'Voeding', MEDICINE: 'Medicijnen', EBOOK: 'E-books' },
      },
      pl: {
        products: 'Produkty', cart: 'Koszyk', product: 'Produkt', origin: 'Pochodzenie', exclVat: 'Netto',
        priceExclVat: 'Cena netto', priceInclVat: 'Cena brutto', qty: 'Ilość', lineTotal: 'Wartość', vat: 'VAT',
        subtotal: 'Suma netto', total: 'Razem brutto', buy: 'Kup', addToCart: 'Dodaj do koszyka', remove: 'Usuń',
        chooseProducts: 'Wybierz produkty', cancel: 'Anuluj',
        productCode: 'Kod produktu', vatCountry: 'VAT ({country})', vatRate: 'VAT ({rate}%)',
        productsNote: 'Ceny w {currency}, bez kosztów wysyłki i VAT. Kliknij produkt, aby zobaczyć cenę z VAT.',
        orderPlaced: 'Zamówienie nr {number} złożone: {total} (w tym {vat} VAT).',
        categories: { LAPTOP: 'Laptopy', BOOK: 'Książki', FOOD: 'Żywność', MEDICINE: 'Leki', EBOOK: 'E-booki' },
      },
      de: {
        products: 'Produkte', cart: 'Warenkorb', product: 'Produkt', origin: 'Herkunft', exclVat: 'Exkl. MwSt.',
        priceExclVat: 'Preis exkl. MwSt.', priceInclVat: 'Preis inkl. MwSt.', qty: 'Menge', lineTotal: 'Summe', vat: 'MwSt.',
        subtotal: 'Zwischensumme (exkl. MwSt.)', total: 'Gesamt (inkl. MwSt.)', buy: 'Kaufen', addToCart: 'In den Warenkorb', remove: 'Entfernen',
        chooseProducts: 'Produkte auswählen', cancel: 'Abbrechen',
        productCode: 'Artikelnummer', vatCountry: 'MwSt. ({country})', vatRate: 'MwSt. ({rate} %)',
        productsNote: 'Preise in {currency}, ohne Versand und MwSt. Klicken Sie auf ein Produkt, um den Preis inkl. MwSt. zu sehen.',
        orderPlaced: 'Bestellung Nr. {number} aufgegeben: {total} (inkl. {vat} MwSt.).',
        categories: { LAPTOP: 'Laptops', BOOK: 'Bücher', FOOD: 'Lebensmittel', MEDICINE: 'Medikamente', EBOOK: 'E-Books' },
      },
      fr: {
        products: 'Produits', cart: 'Panier', product: 'Produit', origin: 'Origine', exclVat: 'HT',
        priceExclVat: 'Prix HT', priceInclVat: 'Prix TTC', qty: 'Qté', lineTotal: 'Total ligne', vat: 'TVA',
        subtotal: 'Sous-total HT', total: 'Total TTC', buy: 'Acheter', addToCart: 'Ajouter au panier', remove: 'Retirer',
        chooseProducts: 'Choisir des produits', cancel: 'Annuler',
        productCode: 'Référence', vatCountry: 'TVA ({country})', vatRate: 'TVA ({rate} %)',
        productsNote: 'Prix en {currency}, hors frais de port et hors TVA. Cliquez sur un produit pour voir son prix TTC.',
        orderPlaced: 'Commande n° {number} passée : {total} (dont {vat} de TVA).',
        categories: { LAPTOP: 'Ordinateurs portables', BOOK: 'Livres', FOOD: 'Alimentation', MEDICINE: 'Médicaments', EBOOK: 'Livres numériques' },
      },
    };
    const defaultLocales = { en: 'en-GB', nl: 'nl-NL', pl: 'pl-PL', de: 'de-DE', fr: 'fr-FR' };

    // On /pl the shop acts as if the customer is in Poland (PLN, Polish VAT, Polish texts), whatever the browser language.
    const forcePoland = /^\/pl\/?$/.test(location.pathname);
    const headers = { 'Content-Type': 'application/json' };
    if (forcePoland) {
      headers['Accept-Language'] = 'pl-PL';
    }

    // Texts follow the first browser language we have translations for; the browser's own locale (fr-CH, de-AT)
    // is kept for number formatting when it matches that language.
    const browserLocale = forcePoland ? 'pl-PL'
      : (navigator.languages || [navigator.language]).find(l => messages[l.split('-')[0].toLowerCase()]) || 'en-GB';
    const lang = browserLocale.split('-')[0].toLowerCase();
    const locale = browserLocale.includes('-') ? browserLocale : defaultLocales[lang];
    document.documentElement.lang = lang;

    function t(key, params = {}) {
      return messages[lang][key].replace(/\{(\w+)\}/g, (_, name) => params[name]);
    }

    for (const el of document.querySelectorAll('[data-i18n]')) {
      el.textContent = t(el.dataset.i18n);
    }

    // The server picks the currency from the customer's location; we show whatever the cart is priced in.
    let money = formatterFor('EUR');

    function formatterFor(code) {
      return new Intl.NumberFormat(locale, { style: 'currency', currency: code });
    }

    function useCurrency(code) {
      money = formatterFor(code);
      document.getElementById('products-note').textContent = t('productsNote', { currency: code });
    }
    useCurrency('EUR');
    const errorEl = document.getElementById('error');
    const confirmationEl = document.getElementById('confirmation');

    async function api(path, options) {
      errorEl.textContent = '';
      confirmationEl.textContent = '';
      const response = await fetch(path, { headers, ...options });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        errorEl.textContent = (body && body.detail) || `${response.status} ${response.statusText}`;
        throw new Error(errorEl.textContent);
      }
      return body;
    }

    function selectBox(product) {
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.name = 'product';
      checkbox.value = product.id;
      checkbox.setAttribute('aria-label', product.name);
      return checkbox;
    }

    function renderProducts(products) {
      const container = document.getElementById('products');
      container.innerHTML = '';
      for (const [category, items] of Map.groupBy(products, p => p.category)) {
        container.appendChild(renderCategory(category, items));
      }
    }

    function renderCategory(category, items) {
      const container = document.createElement('div');
      container.className = 'category';
      // Each category collapses on a click on its name; all start open.
      const collapsible = document.createElement('details');
      collapsible.open = true;
      const summary = document.createElement('summary');
      const heading = document.createElement('h3');
      heading.textContent = messages[lang].categories[category] || category;
      summary.appendChild(heading);
      collapsible.appendChild(summary);
      container.appendChild(collapsible);
      const table = document.createElement('table');
      table.createTHead().innerHTML =
        `<tr><th>${t('product')}</th><th>${t('origin')}</th><th class="num">${t('exclVat')}</th><th></th></tr>`;
      for (const p of items) {
        const row = table.insertRow();
        // A click on the product name unfolds its details, including the price incl. VAT, in the row below.
        const toggle = document.createElement('button');
        toggle.type = 'button'; // the list sits in the dialog's form; a plain button would submit and close it
        toggle.className = 'product-toggle';
        toggle.textContent = p.name;
        toggle.setAttribute('aria-expanded', 'false');
        row.insertCell().appendChild(toggle);
        row.insertCell().innerHTML = `<span class="muted">${p.countryOfOrigin}</span>`;
        const price = row.insertCell(); price.className = 'num'; price.textContent = money.format(p.price);
        const action = row.insertCell(); action.className = 'num';
        action.appendChild(selectBox(p));

        const detailRow = table.insertRow();
        detailRow.className = 'product-detail';
        detailRow.hidden = true;
        const cell = detailRow.insertCell();
        cell.colSpan = 4;
        cell.appendChild(renderProductDetail(p));
        toggle.onclick = () => {
          detailRow.hidden = !detailRow.hidden;
          toggle.setAttribute('aria-expanded', String(!detailRow.hidden));
        };
      }
      collapsible.appendChild(table);
      return container;
    }

    function renderProductDetail(p) {
      const details = document.createElement('dl');
      for (const [label, value, className] of [
        [t('productCode'), p.id],
        [t('priceExclVat'), money.format(p.price)],
        [t('vatRate', { rate: p.vatRate }), money.format(p.priceInclVat - p.price)],
        [t('priceInclVat'), money.format(p.priceInclVat), 'incl-vat'],
      ]) {
        const dt = document.createElement('dt'); dt.textContent = label;
        const dd = document.createElement('dd'); dd.textContent = value;
        if (className) dd.className = className;
        details.append(dt, dd);
      }
      return details;
    }

    function renderCart(cart) {
      useCurrency(cart.currency);
      const tbody = document.getElementById('cart-lines');
      tbody.innerHTML = '';
      for (const line of cart.lines) {
        const row = tbody.insertRow();
        row.insertCell().textContent = line.product.name;
        const price = row.insertCell(); price.className = 'num'; price.textContent = money.format(line.priceInclVat);
        const qty = row.insertCell(); qty.className = 'num'; qty.textContent = line.quantity;
        const total = row.insertCell(); total.className = 'num'; total.textContent = money.format(line.lineTotal);
        const vat = row.insertCell(); vat.className = 'num muted'; vat.textContent = `${line.vatRate}%`;
        const action = row.insertCell(); action.className = 'num';
        const button = document.createElement('button');
        button.textContent = t('remove');
        button.onclick = () => removeFromCart(line.product.id);
        action.appendChild(button);
      }
      document.getElementById('subtotal').textContent = money.format(cart.subtotal);
      document.getElementById('vat').textContent = money.format(cart.vat);
      document.getElementById('vat-label').textContent = t('vatCountry', { country: cart.country });
      document.getElementById('total').textContent = money.format(cart.total);
      document.getElementById('buy').disabled = cart.lines.length === 0;
      document.getElementById('cart').hidden = cart.lines.length === 0;
    }

    async function addToCart(productIds) {
      let cart;
      for (const productId of productIds) {
        cart = await api('/api/cart/items', { method: 'POST', body: JSON.stringify({ productId, quantity: 1 }) });
      }
      renderCart(cart);
    }

    // Products are picked with checkboxes in the dialog and only added to the cart on "Add to cart".
    const dialog = document.getElementById('product-dialog');
    const productForm = dialog.querySelector('form');
    const addSelectedButton = document.getElementById('add-selected');

    function selectedProductIds() {
      return [...productForm.querySelectorAll('input[name="product"]:checked')].map(box => box.value);
    }

    document.getElementById('choose').onclick = () => {
      productForm.reset();
      addSelectedButton.disabled = true;
      dialog.returnValue = ''; // Escape keeps the previous returnValue, which must not count as "add"
      dialog.showModal();
    };
    productForm.onchange = () => { addSelectedButton.disabled = selectedProductIds().length === 0; };
    dialog.onclose = () => {
      if (dialog.returnValue === 'add') {
        addToCart(selectedProductIds());
      }
    };

    async function removeFromCart(productId) {
      renderCart(await api(`/api/cart/items/${productId}`, { method: 'DELETE' }));
    }

    document.getElementById('buy').onclick = async () => {
      const order = await api('/api/cart/checkout', { method: 'POST' });
      renderCart({ lines: [], subtotal: 0, vat: 0, total: 0, currency: order.currency, country: order.country });
      confirmationEl.textContent =
        t('orderPlaced', { number: order.orderNumber, total: money.format(order.total), vat: money.format(order.vat) });
    };


    // Load the cart first: it tells us which currency the product prices are in.
    api('/api/cart').then(renderCart).then(() => api('/api/products')).then(renderProducts);
  </script>
</body>
</html>
